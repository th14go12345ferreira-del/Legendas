name: Build APK com Whisper offline

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar NDK e CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Baixar modelo Whisper Small
        run: |
           mkdir -p app/src/main/assets/models
           curl -L --fail --retry 3 \
           -o app/src/main/assets/models/ggml-small.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin

      - name: Instalar Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Criar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LegendaOffline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
